<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportPilot — Login</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="bg-mesh"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="logo-ring">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="logo" width="40" height="40" style="filter:brightness(0) invert(1)">
      </div>
      <div class="brand-name">SupportPilot</div>
      <div class="text-muted small mt-1">AI-Assisted IT Ticket Desk</div>
    </div>
    <div class="p-4 pt-2">
      {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ url_for('login') }}" id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter any name" required autofocus autocomplete="username">
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-login">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function() {
      const btn = this.querySelector('button[type=submit]');
      btn.style.transform = 'scale(0.96)';
      btn.textContent = 'Signing in…';
    });
  </script>
</body>
</html>
